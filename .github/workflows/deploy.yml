name: Deploy to GitHub Pages

# Build the Vite app and publish it to GitHub Pages. One-time setup: in the
# repository, go to Settings -> Pages -> Build and deployment -> Source and
# choose "GitHub Actions". The site then serves at
# https://<owner>.github.io/<repo>/ on every push to the default branch.

on:
  push:
    branches: [main, claude/kitchen-configurator-scaffold-op49nr]
  workflow_dispatch:

# Allow the deploy job to publish Pages; one concurrent deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Project sites live under /<repo>/, so build with a matching base.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
